name: CI
on:
  pull_request:
  push:
    branches: main
defaults:
  run:
    shell: bash
concurrency:
  group: CI-${{ github.ref }}
  # Queue on all branches and tags, but only cancel overlapping PR burns.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || !startsWith(github.ref, 'refs/tags/') }}
jobs:
  org-check:
    name: Check GitHub Organization
    if: github.repository_owner == 'jsirois'
    runs-on: ubuntu-24.04
    steps:
      - name: Noop
        run: "true"
  checks:
    name: TOXENV=${{ matrix.tox-env }}
    needs: org-check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - check-name: Lint
            python-version: 3.9
            tox-env: lint
          - check-name: Types
            python-version: 3.9
            tox-env: check
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Check ${{ matrix.check-name }}
        uses: pantsbuild/actions/run-tox@main
        with:
          tox-env: ${{ matrix.tox-env }}
  unit-tests-legacy:
    name: (${{ matrix.os }}) TOXENV=py${{ matrix.python-version[0] }}${{ matrix.python-version[1] }}
    needs: org-check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python-version: [2, 7, 18]
            os: ubuntu-24.04
          - python-version: [3, 5, 10]
            os: ubuntu-24.04
          - python-version: [3, 6, 15]
            os: ubuntu-24.04
          - python-version: [3, 7, 17]
            os: ubuntu-24.04
          - python-version: [3, 8, 18]
            os: ubuntu-24.04
          - python-version: [3, 16, "0a1"]
            os: ubuntu-24.04
          - python-version: [2, 7, 18]
            os: macos-15
          - python-version: [3, 16, "0a1"]
            os: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Python Build Deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -y \
            build-essential \
            curl \
            git \
            libbz2-dev \
            libffi-dev \
            liblzma-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libxml2-dev \
            libxmlsec1-dev \
            libzstd-dev \
            make \
            tk-dev \
            xz-utils \
            zlib1g-dev
      - name: Install Pyenv
        run: |
          cd "${RUNNER_TOOL_CACHE}"
          git clone https://github.com/pyenv/pyenv
          (
            cd pyenv
            src/configure
            make -C src
          )
          export PYENV_ROOT="$PWD/pyenv"
          echo "PYENV_ROOT=${PYENV_ROOT}" >> "${GITHUB_ENV}"
          echo "${PYENV_ROOT}/bin" >> "${GITHUB_PATH}"
      - name: Setup Python ${{ join(matrix.python-version, '.') }}
        run: |
          pyenv install ${{ join(matrix.python-version, '.') }}
          echo "${PYENV_ROOT}/versions/${{ join(matrix.python-version, '.') }}/bin" >> "${GITHUB_PATH}"
      - name: Setup Tox Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.11
      - name: Run Unit Tests
        run: |
          python3.11 -V
          python3.11 -mpip install -U pip
          python3.11 -mpip install -U tox
          python3.11 -mtox -epy${{ matrix.python-version[0] }}${{ matrix.python-version[1] }} -- -vvs
  unit-tests:
    name: (${{ matrix.os }}) TOXENV=py${{ matrix.python-version[0] }}${{ matrix.python-version[1] }}
    needs: org-check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: [3, 9]
          - os: ubuntu-24.04
            python-version: [3, 10]
          - os: ubuntu-24.04
            python-version: [3, 11]
          - os: ubuntu-24.04
            python-version: [3, 12]
          - os: ubuntu-24.04
            python-version: [3, 13]
          - os: ubuntu-24.04
            python-version: [3, 14]
          - os: ubuntu-24.04
            python-version: [3, 15]
          - os: macos-15
            python-version: [3, 15]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Python ${{ join(matrix.python-version, '.') }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "${{ join(matrix.python-version, '.') }}"
      - name: Setup Tox Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.11
      - name: Run Unit Tests
        run: |
          python3.11 -V
          python3.11 -mpip install -U pip
          python3.11 -mpip install -U tox
          python3.11 -mtox -epy${{ matrix.python-version[0] }}${{ matrix.python-version[1] }} -- -vvs
